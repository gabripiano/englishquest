<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>English Quest Junior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: single bright "sea" world (deliberately one theme). Home = winding path of lesson nodes grouped in units; lesson = progress bar + exercise + bottom check sheet. Almost no text for the child: everything is spoken. */
:root{
  --sky:#BFE7FF; --sea:#2D9CDB; --sea-deep:#1B6FA8; --sand:#FFF4D6; --ink:#173A5E; --ink-soft:#4F6B86;
  --sun:#FFC83D; --sun-deep:#E0A100; --coral:#FF6B6B; --coral-deep:#D94A4A; --leaf:#3BBF7A; --leaf-deep:#2A9460;
  --tile:#FFFFFF; --lock:#D5DEE6; --lock-deep:#AEBBC7; --okbg:#D7F5E3; --badbg:#FFE1DD;
  --font:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html{background:var(--sand)}
body{background:linear-gradient(180deg,var(--sky) 0%,#DDF3FF 55%,var(--sand) 100%) fixed;background-color:var(--sky);color:var(--ink);font-family:var(--font);overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun-deep);outline-offset:3px}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}

/* barra in alto */
.top{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;padding-block:6px;background:rgba(221,243,255,.94);border-radius:0 0 18px 18px}
.pill{background:var(--tile);border-radius:999px;padding:6px 12px;font-weight:800;font-size:19px;box-shadow:0 4px 0 rgba(23,58,94,.15);white-space:nowrap;display:flex;align-items:center;gap:6px;border:none}
.pill.dim{opacity:.55}
.ring{width:30px;height:30px}
.ring circle{fill:none;stroke-width:5}
.round{width:54px;height:54px;border-radius:50%;border:none;background:var(--tile);font-size:26px;box-shadow:0 5px 0 rgba(23,58,94,.18);display:grid;place-items:center;flex:none}
.round:active,.pill:active{transform:translateY(3px)}
.grow{flex:1}

/* percorso */
.section{background:var(--ink);color:#fff;border-radius:20px;padding:10px 16px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.unit{border-radius:22px;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.unit .ic{font-size:40px;line-height:1}
.unit small{display:block;font-size:13px;font-weight:800;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.unit b{font-size:24px;line-height:1.05}
.jumpbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.jumpbar button{flex:none;border:none;border-radius:16px;background:var(--tile);box-shadow:0 4px 0 rgba(23,58,94,.15);padding:6px 10px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.jumpbar button .e{font-size:22px}
.jumpbar button.cur{outline:3px solid var(--sun-deep)}
.jumpbar .sep{flex:none;align-self:center;font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding:0 2px}
.skip{margin-left:auto;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:6px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.skip.arm{background:#fff;color:var(--ink)}
.unit{scroll-margin-top:84px;flex-wrap:wrap}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:48px 0 26px}
.node{position:relative;width:78px;height:72px;border-radius:50%;border:none;font-size:34px;display:grid;place-items:center;color:#fff;
  background:var(--c);box-shadow:0 8px 0 var(--cd)}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 var(--cd)}
.node.lock{--c:var(--lock);--cd:var(--lock-deep);filter:saturate(.3)}
.node.lock span{opacity:.5}
.node.done{--c:var(--sun);--cd:var(--sun-deep)}
.node.now{animation:bob 1.6s ease-in-out infinite}
.node.now::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:6px solid color-mix(in srgb,var(--c) 35%,transparent)}
.start{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--tile);color:var(--c);border:3px solid var(--lock);border-radius:14px;padding:2px 12px;font-weight:800;font-size:17px;white-space:nowrap;letter-spacing:.04em}
.start::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--lock)}
@keyframes bob{50%{transform:translateY(-6px)}}
.mascot-side{font-size:56px;line-height:1}
.practice{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:68px;height:68px;border-radius:22px;border:none;background:var(--coral);font-size:34px;box-shadow:0 6px 0 var(--coral-deep)}
.practice[disabled]{background:var(--lock);box-shadow:0 6px 0 var(--lock-deep);opacity:.7}

/* lezione */
.lbar{display:flex;align-items:center;gap:12px;padding-block:4px}
.x{border:none;background:none;font-size:28px;color:var(--ink-soft);width:44px;height:44px;border-radius:12px}
.x.arm{background:var(--badbg);color:var(--coral-deep);font-size:15px;font-weight:800;width:auto;padding:0 10px}
.prog{flex:1;height:18px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .4s ease;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.combo{font-weight:800;color:var(--coral-deep);font-size:18px;min-width:44px;text-align:right}
.badge-new{align-self:center;background:var(--coral);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;letter-spacing:.06em;font-size:15px}
.ask{display:flex;justify-content:center;gap:12px;align-items:flex-end}
.bigear{width:112px;height:112px;border-radius:50%;border:none;background:var(--sun);font-size:54px;box-shadow:0 8px 0 var(--sun-deep);position:relative}
.bigear:active{transform:translateY(4px);box-shadow:0 4px 0 var(--sun-deep)}
.bigear.talk::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--sun);animation:ring 1s ease-out infinite}
.slow{width:60px;height:60px;border-radius:50%;border:none;background:var(--tile);font-size:28px;box-shadow:0 5px 0 rgba(23,58,94,.18)}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.tile{border:4px solid transparent;border-radius:28px;background:var(--tile);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;font-size:clamp(56px,18vw,104px);line-height:1;box-shadow:0 7px 0 rgba(23,58,94,.18);transition:opacity .25s,transform .15s;overflow:hidden;padding:0}
.grid.three .tile{font-size:clamp(40px,13vw,78px)}
.tile:active{transform:translateY(4px)}
.tile.sel{border-color:var(--sea);background-color:#E3F3FF;box-shadow:0 7px 0 var(--sea)}
.tile.right{border-color:var(--leaf);box-shadow:0 7px 0 var(--leaf)}
.tile.wrong{animation:wiggle .45s;opacity:.4}
.tile.matched{opacity:.25;pointer-events:none}
.tile.hero{width:min(260px,70%);justify-self:center;font-size:clamp(90px,28vw,150px);pointer-events:none}
@keyframes wiggle{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.emo.big{font-size:1.15em}.emo.small{font-size:.42em}
.swatch{width:62%;aspect-ratio:1/1;border-radius:50%;border:5px solid rgba(23,58,94,.12)}
.count{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;font-size:.38em;padding:8px;width:100%;height:100%}
.word{text-align:center;font-weight:800;font-size:34px;line-height:1.1;color:var(--ink)}
.word small{display:block;font-size:20px;color:var(--ink-soft)}
.spk{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.sbtn{width:96px;height:96px;border-radius:26px;border:4px solid transparent;font-size:40px;box-shadow:0 7px 0 rgba(0,0,0,.2);color:#fff;display:grid;place-items:center}
.sbtn.sel{border-color:var(--ink);transform:translateY(2px)}
.sbtn.matched{opacity:.25;pointer-events:none}
.sbtn.wrong{animation:wiggle .45s}
.s0{background:#7C5CFF}.s1{background:#FF8A1F}.s2{background:#15B3A6}.s3{background:#E84D8A}
.pairs{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.pairs .col{display:grid;gap:14px}
.pairs .tile{font-size:clamp(44px,14vw,72px);width:100%;max-width:150px;justify-self:center}
.pairs .sbtn{width:84px;height:84px}

/* foglio in basso */
.dock{position:sticky;bottom:0;margin-top:auto;padding-block:12px calc(10px + env(safe-area-inset-bottom,0px))}
.sheet{border-radius:24px;padding:14px;display:flex;align-items:center;gap:12px}
.sheet.ok{background:var(--okbg)} .sheet.bad{background:var(--badbg)}
.sheet .m{font-size:52px;line-height:1}
.sheet .t{flex:1;min-width:0;font-weight:800;font-size:22px;line-height:1.15}
.sheet.ok .t{color:var(--leaf-deep)} .sheet.bad .t{color:var(--coral-deep)}
.sheet .t small{display:block;font-size:17px;color:var(--ink)}
.go{border:none;border-radius:20px;background:var(--leaf);color:#fff;font-weight:800;font-size:30px;min-width:88px;height:72px;box-shadow:0 7px 0 var(--leaf-deep);padding:0 18px}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 var(--leaf-deep)}
.go[disabled]{background:var(--lock);box-shadow:0 7px 0 var(--lock-deep);color:#fff}
.go.bad{background:var(--coral);box-shadow:0 7px 0 var(--coral-deep)}
.go.wide{width:100%}

/* fine lezione, scrigno, genitori */
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:18px}
.hero-emo{font-size:120px;line-height:1;animation:popin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.2) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
h1{margin:0;font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--coral)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--tile);border-radius:18px;padding:10px 16px;font-weight:800;font-size:22px;box-shadow:0 5px 0 rgba(23,58,94,.15);min-width:96px}
.chip small{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase}
.album{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:38px;background:var(--tile);border-radius:24px;padding:12px 16px;box-shadow:0 5px 0 rgba(23,58,94,.12)}
.album span.off{filter:grayscale(1) opacity(.25)}
.panel{background:rgba(255,255,255,.88);border-radius:22px;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--font);font-size:22px}
.panel p{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sky);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--font);font-size:26px;line-height:1.1}
.wlist{display:grid;gap:6px;max-height:340px;overflow:auto}
.wrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 10px}
.wrow .p{font-size:30px;line-height:1;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;overflow:hidden}
.wrow .p .count{font-size:9px;padding:0}
.wrow .p .swatch{width:70%}
.str{display:flex;gap:3px}
.str i{width:10px;height:14px;border-radius:3px;background:var(--lock)}
.str i.on{background:var(--leaf)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sbtn2{border:2px solid var(--lock-deep);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-family:inherit;font-size:14px}
.sbtn2.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sbtn2.danger{color:var(--coral-deep);border-color:var(--coral)}

/* spazio */
.tile.space{background-color:#101538;background-image:radial-gradient(circle at 18% 22%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 78% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 70%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 25% 82%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 50%,#232B6E,#101538 75%);box-shadow:0 7px 0 #070A1F}
.tile.space.sel{border-color:var(--sun)}
.pl{display:block;border-radius:50%;width:var(--s,56%);aspect-ratio:1/1}
.pl.sun{--s:66%;background:radial-gradient(circle,#FFF6B0,#FFC53D 55%,#FF8A00);box-shadow:0 0 26px 8px rgba(255,180,0,.55)}
.pl.mercury{--s:32%;background:radial-gradient(circle at 35% 35%,#E2DDD8,#8C8580 72%)}
.pl.venus{--s:46%;background:radial-gradient(circle at 35% 35%,#FFF0C2,#E3B45E 75%)}
.pl.mars{--s:40%;background:radial-gradient(circle at 35% 35%,#FF9A6B,#C1440E 75%)}
.pl.jupiter{--s:74%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.35),transparent 55%),radial-gradient(ellipse 14% 8% at 64% 62%,#C0412B 90%,transparent 100%),repeating-linear-gradient(172deg,#EBCFA4 0 9%,#C98E5A 9% 15%,#F4E2C4 15% 22%,#B9774A 22% 26%)}
.pl.uranus{--s:52%;background:radial-gradient(circle at 35% 35%,#E6FCFF,#7FD6E3 75%)}
.pl.neptune{--s:52%;background:radial-gradient(circle at 35% 35%,#8FB8FF,#2546B8 75%)}
.bh{position:relative;display:block;width:44%;aspect-ratio:1/1;border-radius:50%;background:#000;box-shadow:0 0 0 5px #FFB547,0 0 16px 9px rgba(255,120,0,.75),0 0 40px 18px rgba(255,190,80,.3)}
.bh::before{content:"";position:absolute;left:-42%;right:-42%;top:38%;bottom:38%;border-radius:50%;border:6px solid #FFC861;box-shadow:0 0 12px 2px rgba(255,150,40,.8);transform:rotate(-14deg)}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:800;font-size:20px;padding:10px 18px;border-radius:999px;transition:all .3s;z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.vsel{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;padding:10px;border-radius:12px;border:2px solid var(--lock-deep);background:#fff}
.vlbl{display:block;font-weight:800;margin:10px 0 4px}
.sgtop{display:flex;align-items:center;gap:8px}
.sgbar{flex:1;height:16px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.sgbar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--leaf),var(--sun));border-radius:999px}
.sgwrap{position:relative;flex:1;min-height:62vh;border-radius:26px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.5) 0 2px,transparent 3px) 0 0/28px 28px,linear-gradient(160deg,#C9F2D9,#A6E4C1);box-shadow:inset 0 0 0 6px rgba(42,148,96,.35)}
.sgwrap canvas{position:absolute;inset:0}
#sgf{position:absolute;inset:0;pointer-events:none}
.sfood{position:absolute;left:0;top:0;width:68px;height:68px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 5px 0 rgba(23,58,94,.18);overflow:hidden}
.sfood .swatch{width:70%;border-width:3px}.sfood .count{font-size:14px;padding:2px}
.sfood.tile.space{aspect-ratio:auto;border:0}
.sfood.nope{animation:wiggle .4s}
.sfood.eaten{opacity:0;transition:opacity .3s}
.sfood.hintme{box-shadow:0 0 0 5px var(--sun),0 5px 0 rgba(23,58,94,.18)}
.sghint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:999px;font-weight:800;transition:opacity .4s;white-space:nowrap;font-size:16px;pointer-events:none}
.sgplay{background:var(--sea);box-shadow:0 7px 0 var(--sea-deep);font-size:24px}
.sgbtn{position:relative;font-size:26px;background:#E3F8EC;box-shadow:0 5px 0 var(--leaf-deep)}.sgbtn.off{filter:grayscale(.7);opacity:.7}.sgbtn b{position:absolute;right:-4px;top:-4px;background:var(--coral);color:#fff;border-radius:999px;font-size:13px;min-width:20px;height:20px;display:grid;place-items:center}
@keyframes micp{50%{transform:scale(1.08)}}
.microw{display:flex;justify-content:center}
.micbig{width:110px;height:110px;border-radius:50%;border:none;background:var(--coral);color:#fff;font-size:52px;box-shadow:0 8px 0 var(--coral-deep)}
.micbig.on{animation:micp 1s infinite;background:var(--leaf);box-shadow:0 8px 0 var(--leaf-deep)}
.micbig:disabled{opacity:.5}
.ghostgo{background:#fff;color:var(--ink);box-shadow:0 7px 0 rgba(23,58,94,.18);font-size:22px}
.practice.spk2{bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--sea);box-shadow:0 6px 0 var(--sea-deep)}.practice.spk2.off{filter:grayscale(.8);opacity:.6}

/* ---- mondo di Pip ---- */
.pip .pbody{transform-origin:100px 185px;animation:pbob 2.4s ease-in-out infinite}
.pip .peyes{transform-origin:100px 98px;animation:pblink 4.2s infinite}
.pip.talk .pmouth{transform-origin:100px 130px;animation:ptalk .28s infinite alternate}
.pip.eat .pbody{animation:pmunch .3s 4}
.pip.sad .pbody{animation:none;transform:translateY(6px) scaleY(.96)}
.pip.wow .pbody{animation:pjump .5s 2}
@keyframes pbob{50%{transform:translateY(-6px) scaleY(1.02)}}
@keyframes pblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ptalk{to{transform:scaleY(.35)}}
@keyframes pmunch{50%{transform:scale(1.06,.92)}}
@keyframes pjump{50%{transform:translateY(-26px)}}
.pipbanner{position:relative;display:flex;align-items:center;gap:10px;border:none;border-radius:26px;padding:10px 16px 10px 8px;min-height:120px;overflow:hidden;box-shadow:0 7px 0 rgba(23,58,94,.18);text-align:left;color:var(--ink)}
.pipbanner.dark,.pscene.dark{color:#fff}
.pbpip{position:relative;z-index:1;flex:none}
.pbtxt{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.85);border-radius:16px;padding:8px 12px;color:var(--ink)}
.pbtxt b{font-size:24px;line-height:1.1}.pbtxt small{font-size:15px;font-weight:700}
.pbgo{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:24px;box-shadow:0 5px 0 var(--sun-deep);color:var(--ink)}
.deco{position:absolute;font-size:30px;opacity:.9;pointer-events:none;animation:dfl 6s ease-in-out infinite}
.deco.d0{left:4%;top:6%}.deco.d1{right:6%;top:10%;animation-delay:-1s}.deco.d2{left:40%;top:3%;animation-delay:-2s;font-size:24px}
.deco.d3{right:24%;bottom:8%;animation-delay:-3s}.deco.d4{left:8%;bottom:6%;animation-delay:-4s}.deco.d5{right:3%;bottom:30%;animation-delay:-5s;font-size:22px}
@keyframes dfl{50%{transform:translateY(-8px) rotate(4deg)}}
.pscene{position:relative;border-radius:28px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35)}
.pipwrap{position:relative;z-index:1;margin-bottom:10px;cursor:pointer}
.pplace{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;z-index:1}
.hapbar span{display:inline-block;width:80px;height:12px;background:#E6EDF2;border-radius:999px;overflow:hidden;margin-left:4px}

/* più alto = più naturale (voci neurali di Edge, Google, voci Premium/Avanzate di Apple) */
function rank(v,lang){
  if(BAD.test(v.name)) return -50;
  let s=0; const n=v.name;
  if(/natural|neural|online/i.test(n)) s+=60;
  if(/premium|enhanced|avanzat|siri/i.test(n)) s+=45;
  if(/google/i.test(n)) s+=30;
  if(lang==="en"&&/zira/i.test(n)) s+=200;   // scelta di papà: Zira (Stati Uniti)
  if(lang==="en"){ if(/^en[-_]GB/i.test(v.lang)) s+=12; if(/maisie/i.test(n)) s+=8; if(/sonia|libby|serena|kate|martha|stephanie/i.test(n)) s+=5; }
  if(FEM.test(n)) s+=10; if(MALE.test(n)) s-=15;
  if(v.localService===false) s+=2;
  return s;
}
const allV=()=>{ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } };
const listV=lang=>allV().filter(v=>lang==="it"?/^it/i.test(v.lang):/^en/i.test(v.lang)).sort((x,y)=>rank(y,lang)-rank(x,lang));
function voices(){ const en=listV("en"), it=listV("it");
  vEN=(P.vEN&&en.find(v=>v.name===P.vEN))||en[0]||null; vIT=(P.vIT&&it.find(v=>v.name===P.vIT))||it[0]||null; }

const canSpeak=(()=>{try{return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";}catch(e){return false;}})();
const natural=v=>v&&/natural|neural|online|premium|enhanced|google/i.test(v.name);
/* frasi spezzate dove c'è la punteggiatura, con piccole pause: suona più umano */
function say(parts,onEnd){
  if(!canSpeak){ onEnd&&setTimeout(onEnd,300); return; }
  try{ speechSynthesis.cancel(); if(!vEN&&!vIT) voices();
    const q=[]; parts.forEach(([t,l,r])=>{ String(t).split(/(?<=[.!?…])\s+/).filter(Boolean).forEach(s=>q.push([s,l,r])); });
    const spd=P.vRate||1;
    q.forEach(([t,l,r],i)=>{ const u=new SpeechSynthesisUtterance(t);
      u.lang=l==="it"?"it-IT":"en-GB"; const v=l==="it"?vIT:vEN; if(v){ u.voice=v; u.lang=v.lang; }
      const base=r||(l==="en"?0.8:0.95);
      u.rate=Math.max(0.5,Math.min(1.2,(natural(v)?base:base*0.95)*spd)); u.pitch=natural(v)?1.0:1.08;
      if(i===q.length-1) u.onend=()=>onEnd&&onEnd();
      speechSynthesis.speak(u); });
  }catch(e){ onEnd&&onEnd(); }
}
let ctx=null;
function tone(kind){
  try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==="yes"?[523,659,784]:kind==="win"?[523,659,784,1047,784,1047]:kind==="tick"?[880]:[300,240];
    seq.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*(kind==="win"?0.13:0.1);
      o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==="tick"?0.08:0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.25); });
  }catch(e){}
}

function reviewPick(n, exclude){

    .sort((a,b)=>{ const A=P.words[a],B=P.words[b]; const da=A.due<=now?0:1, db=B.due<=now?0:1; return da-db || A.s-B.s || A.due-B.due; })

/* =========================================================
   COSTRUZIONE DELLE LEZIONI
   ========================================================= */
function buildLesson(node){
  const ex=[];
  if(node.t==="lesson"){
    const ws=node.ws, rev=reviewPick(node.ui===0&&node.li===0?0:3, ws);
    const mic=micOK();
    const pz=!!UNITS[node.ui].puzzle;
    ws.forEach((k,j)=>{ ex.push({t:"intro",w:k}); ex.push({t:"listen",w:k}); if(pz||j===0) ex.push({t:pzKind(k),w:k}); ex.push({t:"speak",w:k}); });
    ex.push({t:"pairs",ws:ws.slice(0,3)});
    ex.push({t:"sound",w:ws[0]});
    rev.forEach((k,i)=>ex.push({t:i%2?"sound":"listen",w:k}));
    ex.push({t:"listen",w:ws[1]||ws[0]});
    if(ws[2]) ex.push({t:"sound",w:ws[2]});

  } else if(node.t==="speakdrill"){
    const cu=NODES[Math.min(P.pos,NODES.length-1)].ui, unitK=UNITS[cu].items.map((_,i)=>cu+":"+i);
    let ks=unitK.concat(learned().filter(k=>!unitK.includes(k)).sort((a,b)=>P.words[a].s-P.words[b].s));
    if(ks.length<4) ks=[...new Set(ks.concat(UNITS[0].items.map((_,i)=>"0:"+i)))];
    shuffle(ks.slice(0,Math.max(6,unitK.length))).slice(0,6).forEach(k=>ex.push({t:"speak",w:k}));
  } else {
    const pool = node.t==="trophy" ? UNITS[node.ui].items.map((_,i)=>node.ui+":"+i) : reviewPick(9,[]);
    const ks=shuffle(pool);
    ks.slice(0,8).forEach((k,i)=>ex.push({t:(node.t==="trophy"&&i%3===1)?pzKind(k):i%3===2?"sound":"listen",w:k}));
    if(ks.length>=3) ex.splice(4,0,{t:"pairs",ws:ks.slice(0,3)});
    ex.push({t:"speak",w:ks[0]});
  }
  return ex;
}
function nOpts(k){ const u=W[k].u; return (u===0 ? 3 : 4); }
function makeOpts(k){
  const u=W[k].u, n=Math.min(nOpts(k), UNITS[u].items.length);
  const others=shuffle(UNITS[u].items.map((_,i)=>u+":"+i).filter(x=>x!==k)).slice(0,n-1);
  return shuffle([k,...others]);
}

function spellTok(k){ const w=W[k]; if(isAlpha(k)) return w.pic.word.split("");
  const clean=w.en.replace(/[.!?,]/g,""); if(clean.includes(" ")) return clean.split(" ");
  if(/^[a-z]{3,7}$/i.test(clean)) return clean.toUpperCase().split(""); return null; }

const sBlocked=(x,y,r)=>G.walls.some(([wx,wy,ww,wh])=>x>wx-r&&x<wx+ww+r&&y>wy-r&&y<wy+wh+r);

function phraseScore(target,heard){ const t=nrm(target).split(" ").filter(w=>!["a","an","the"].includes(w)), hw=nrm(heard).split(" "); let j=0,ok=0;
  t.forEach(w=>{ for(let i=j;i<hw.length;i++){ if(hw[i]===w||(w.length>3&&1-lev(hw[i],w)/Math.max(hw[i].length,w.length)>=0.7)||(HOMO[w]||[]).includes(hw[i])){ ok++; j=i+1; break; } } });
  return ok/t.length; }
function pgListen(){
  const g=PG; if(!micOK()||g.listening) return;
  try{ speechSynthesis.cancel(); }catch(x){}
  let r; try{ r=new SRC(); }catch(x){ return; }
  r.lang="en-GB"; r.maxAlternatives=5; r.interimResults=false; g.listening=true; render(); let got=false;
  r.onresult=ev=>{ got=true; const res=ev.results[0], alts=[]; for(let i=0;i<res.length;i++) alts.push(res[i].transcript);
    let best=0,bestA=alts[0]||""; alts.forEach(x=>{ const s=Math.min(pronScore(g.say,x),1)*(g.lvl>1?1:1); const s2=g.lvl>1?phraseScore(g.say,x):s; if(s2>best){ best=s2; bestA=x; } });
    g.heard=bestA; g.tries++;
    if(best>=0.8){ g.state="ok"; pgWin(best>=0.99?3:2,"⭐"); srGood(g.target); pgSay([[pick(PRAISE),"en"],[g.say,"en"]],()=>{ pgAfter(); }); }
    else { tone("no"); pgSay([["Listen!","en"],[g.say,"en",0.7]]); } };
  r.onend=()=>{ g.listening=false; if(!got) g.heard=""; if(screen==="pgame") render(); };
  r.onerror=()=>{};
  try{ r.start(); }catch(x){ g.listening=false; render(); }
}

  const nx=$("#next"); if(nx) nx.onclick=()=>{ if(e.t==="speak"&&L.state==="ans"){ L.graded++; L.right++; } nextEx(); };
  const mc=$("#mic"); if(mc) mc.onclick=()=>micListen(e);
  const im=$("#imic"); if(im) im.onclick=()=>{ if(!micOK()){ toast(inFrame?"🎤 Il microfono funziona dal sito GitHub in Safari, non dentro Claude":"🎤 Microfono non disponibile su questo browser"); return; } introListen(e); };
  const mo2=$("#micoff"); if(mo2) mo2.onclick=()=>{ toast(inFrame?"🎤 Il microfono funziona dal sito GitHub, non dentro Claude":"🎤 Microfono non disponibile qui"); say([[W[e.w].en,"en"]]); };
  const sm=$("#skipmic"); if(sm) sm.onclick=()=>{ try{ REC&&REC.abort(); }catch(x){} nextEx(); };
}
function renderEnd(a){
  const E=END;
  a.innerHTML=`<div class="center">
    <div class="hero-emo">${E.sticker||MASCOT}</div>
    <h1>${E.trophy?"Unità completata!":"Lezione completata!"}<br><em>${E.perfect?"Perfetto!":"Bravissimo!"}</em></h1>
    <div class="chips">
      <div class="chip"><small>Punti</small>⭐ +${E.xp}</div>
      <div class="chip"><small>Precisione</small>🎯 ${E.acc}%</div>
      <div class="chip"><small>Giorni di fila</small>🔥 ${streakNow()}</div>
    </div>
    ${E.goalHit?`<div class="chip">🎉 Obiettivo di oggi raggiunto!</div>`:""}
    ${E.sticker?`<div class="album">${UNITS.map(u=>`<span class="${P.stickers.includes(u.st)?"":"off"}">${u.st}</span>`).join("")}</div>`:""}
    ${SNSAVE?`<button class="go wide sgplay" id="snk">🐍 Torna al serpente: quadro ${SNSAVE.lvl+1} ${SMAPS[SNSAVE.lvl].ic}</button>`:(P.snk||0)>0?`<button class="go wide sgplay" id="snk">🐍 Premio: gioca al serpente!</button>`:""}
  </div><div class="dock"><button class="go wide" id="home" aria-label="Continua">➜</button></div>`;
  $("#home").onclick=()=>{ screen="home"; render(); };
  const sk=$("#snk"); if(sk) sk.onclick=startSnake;
}
function renderChest(a){
  a.innerHTML=`<div class="center"><div class="hero-emo">🎁</div><h1>Uno scrigno!<br><em>+10 ⭐</em></h1><div class="mascot-side">${MASCOT}</div></div>
    <div class="dock"><button class="go wide" id="home" aria-label="Continua">➜</button></div>`;
  $("#home").onclick=()=>{ screen="home"; render(); };
}
function renderParent(a){
  const ks=learned(), strong=ks.filter(k=>P.words[k].s>=3).length;
  const lessonsDone=NODES.slice(0,P.pos).filter(n=>n.t!=="chest").length;
  const weak=ks.slice().sort((x,y)=>P.words[x].s-P.words[y].s || P.words[y].ko-P.words[x].ko);
  a.innerHTML=`<div class="top"><button class="round" id="back" aria-label="Indietro">←</button><div class="grow"></div></div>
  <div class="panel"><h2>Area genitori</h2>
    <div class="stats">
      <div class="stat"><b>${ks.length}/${Object.keys(W).length}</b>parole incontrate</div>
      <div class="stat"><b>${strong}</b>parole sicure</div>
      <div class="stat"><b>🔥 ${streakNow()}</b>giorni di fila</div>
      <div class="stat"><b>${lessonsDone}</b>lezioni fatte</div>
    </div>
    <p><b>Come funziona.</b> Come in Duolingo, ogni lezione presenta 3 parole nuove con figura, voce e traduzione, poi le fa riconoscere in modi diversi: ascolta e tocca la figura, scegli il suono giusto, unisci le coppie, ripeti a voce. Gli errori vengono riproposti a fine lezione. Ogni parola ha una forza da 0 a 5: sale quando la indovina e scende quando la sbaglia. Le parole deboli o da ripassare oggi tornano nelle lezioni successive e nel tasto 💪 Ripasso. Dopo 1, 2, 4, 7 e 14 giorni la parola si ripresenta, così passa nella memoria a lungo termine.</p>
    <p><b>Consiglio:</b> una o due lezioni al giorno, meglio se insieme. Nell'esercizio "ripeti" siete voi a confermare con ✔ dopo che il bambino ha ripetuto la parola.</p>
  </div>
  <div class="panel"><h2>Obiettivo giornaliero</h2>
    <div class="row">${[10,20,30,50].map(g=>`<button class="sbtn2 ${P.goal===g?"on":""}" data-g="${g}">${g} punti${g===10?" (1 lezione)":g===20?" (2 lezioni)":""}</button>`).join("")}</div>
  </div>
  <div class="panel"><h2>Report: parlato e Pip</h2>
    <div class="stats"><div class="stat"><b>${Object.keys(P.book||{}).length}</b>parole registrate nel quaderno</div><div class="stat"><b>${(P.pip&&P.pip.games)||0}</b>giochi con Pip</div><div class="stat"><b>🐾 ${(P.pip&&P.pip.paws)||0}</b>zampette</div></div>
    <p><b>Livello di parlato per unità</b> (⭐ parole · ⭐⭐ frasi brevi · ⭐⭐⭐ frasi lunghe):</p>
    <div class="wlist">${UNITS.map((u,ui)=>`<div class="wrow"><span class="p">${u.ic}</span><span><b>${u.nm}</b></span><span>${"⭐".repeat((P.tlv||{})[ui]||1)}</span></div>`).join("")}</div>
    <p><b>Come aiutarlo fuori dall'app:</b> usate in casa le parole delle unità fatte (a tavola, giocando, vestendovi), chiedetegli «What's this?» indicando le cose, e lodate ogni tentativo anche se la pronuncia non è perfetta.</p>
  </div>
  <div class="panel"><h2>Parole da rinforzare</h2>
    ${ks.length?`<div class="wlist">${weak.map(k=>{ const w=W[k], s=P.words[k].s;
      return `<div class="wrow"><span class="p ${isSpace(k)?"tile space":""}" style="${isSpace(k)?"box-shadow:none;border:0;aspect-ratio:auto":""}">${pic(w.pic)}</span><span><b>${w.en}</b> · ${w.it}</span><span class="str">${[1,2,3,4,5].map(i=>`<i class="${i<=s?"on":""}"></i>`).join("")}</span></div>`; }).join("")}</div>`:"<p>Ancora nessuna parola: iniziate la prima lezione!</p>"}
  </div>
  <div class="panel"><h2>Album degli adesivi</h2><div class="album" style="box-shadow:none">${UNITS.map(u=>`<span class="${P.stickers.includes(u.st)?"":"off"}">${u.st}</span>`).join("")}</div></div>
  <div class="panel"><h2>Salvataggio dei progressi</h2>
    <p>${storageOk?`✅ I progressi si salvano <b>da soli in questo browser</b> dopo ogni risposta${P.savedAt?` (ultimo salvataggio: ${new Date(P.savedAt).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})})`:""}. Riaprendo il gioco sullo stesso dispositivo e con lo stesso browser si riparte da dove eravate.`:"⚠️ Questo browser non permette di salvare (forse è una finestra in incognito): i progressi si perdono chiudendo la pagina. Usate una finestra normale."}</p>
    <p>Per spostarli su un altro dispositivo o browser: copiate il codice qui e incollatelo nell'altro.</p>
    <div class="row"><button class="sbtn2" id="exp">📋 Copia codice progressi</button></div>
    <textarea id="kcode" readonly hidden style="width:100%;min-height:70px;font-size:12px;border-radius:10px;border:2px solid var(--lock-deep);padding:8px"></textarea>
    <textarea id="kpaste" placeholder="Incolla qui un codice (inizia con EQJ1:)" style="width:100%;min-height:70px;font-size:12px;border-radius:10px;border:2px solid var(--lock-deep);padding:8px"></textarea>
    <div class="row"><button class="sbtn2" id="imp">${parentArm==="imp"?"Sicuri? Sostituisce i progressi attuali":"Ripristina dal codice"}</button></div>
  </div>
  <div class="panel"><h2>Voce</h2>
    <p>Scegliete la voce più naturale. Le migliori sono quelle con <b>«Natural»</b> o <b>«Online»</b> nel nome (in Microsoft Edge: <b>Maisie</b>, voce di bambina inglese, oppure Sonia o Libby; in italiano Elsa o Isabella), oppure <b>«Premium/Avanzata»</b> su iPhone e Mac (Impostazioni › Accessibilità › Contenuto letto ad alta voce › Voci: scaricate «Serena» o «Kate» in inglese e «Alice» o «Federica» in italiano).</p>
    <label class="vlbl">🇬🇧 Inglese</label>
    <div class="row"><select id="vsEN" class="vsel">${listV("en").map(v=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${vEN&&vEN.name===v.name?"selected":""}>${natural(v)?"⭐ ":""}${v.name} (${v.lang})</option>`).join("")||"<option>Nessuna voce inglese</option>"}</select><button class="sbtn2" id="vtEN">▶ Prova</button></div>
    <label class="vlbl">🇮🇹 Italiano</label>
    <div class="row"><select id="vsIT" class="vsel">${listV("it").map(v=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${vIT&&vIT.name===v.name?"selected":""}>${natural(v)?"⭐ ":""}${v.name}</option>`).join("")||"<option>Nessuna voce italiana</option>"}</select><button class="sbtn2" id="vtIT">▶ Prova</button></div>
    <label class="vlbl">Velocità</label>
    <div class="row">${[[0.8,"🐢 Più lenta"],[1,"Normale"],[1.15,"🐇 Più veloce"]].map(([r,l])=>`<button class="sbtn2 ${(P.vRate||1)===r?"on":""}" data-vr="${r}">${l}</button>`).join("")}</div>
    ${natural(vEN)?"":`<p>⚠️ Su questo dispositivo non vedo voci inglesi naturali: per la voce migliore aprite il gioco con <b>Microsoft Edge</b> sul computer, oppure scaricate una voce «Avanzata» su iPhone.</p>`}
  </div>
  <div class="panel"><h2>Pronuncia con il microfono</h2>
    ${!SRC?`<p>Questo browser non ha il riconoscimento della voce. Su iPad usate Safari (iPadOS 14.5 o più recente) con la Dettatura attiva; sul computer Chrome o Edge.</p>`
     :inFrame?`<p>Qui dentro Claude il microfono è bloccato. Aprite il gioco dal <b>vostro sito su GitHub</b>: lì nell'esercizio «ripeti» compare il 🎤 e il gioco ascolta la pronuncia.</p>`
     :`<p>Nell'esercizio «ripeti» il bambino tocca 🎤 e dice la parola: il gioco la riconosce e dà ⭐⭐⭐. Se non la capisce dopo due prove, potete confermare voi con ✔. Le voci dei bambini sono difficili da riconoscere: il controllo è volutamente generoso.</p>
       <div class="row"><button class="sbtn2 ${P.micOn!==false?"on":""}" id="micOn">🎤 Microfono ${P.micOn!==false?"attivo":"spento"}</button><button class="sbtn2" id="micTest">Prova: di' «apple»</button></div><p id="micTestOut"></p>`}
  </div>
  <div class="panel"><h2>Opzioni</h2><div class="row">
    <button class="sbtn2" id="unlock">${parentArm==="unlock"?"Sicuri? Tocca ancora":"Sblocca tutto il percorso"}</button>
    <button class="sbtn2 danger" id="reset">${parentArm==="reset"?"Sicuri? Tocca ancora":"Azzera tutti i progressi"}</button>
    </div>${canSpeak?"":"<p><b>Attenzione:</b> questo browser non supporta la voce. Provate con Chrome o Safari.</p>"}</div>`;
  $("#back").onclick=()=>{ screen="home"; render(); };
  const mo=$("#micOn"); if(mo) mo.onclick=()=>{ P.micOn=P.micOn===false; save(); render(); };
  const mt=$("#micTest"); if(mt) mt.onclick=()=>{ const out=$("#micTestOut"); try{ const r=new SRC(); r.lang="en-GB"; r.maxAlternatives=5; out.textContent="🎙️ Ti ascolto…";
    r.onresult=ev=>{ const a=[]; for(let i=0;i<ev.results[0].length;i++) a.push(ev.results[0][i].transcript); const s=Math.max(...a.map(x=>pronScore("apple",x))); out.textContent=`Ho sentito «${a[0]}» → ${s>=0.8?"✅ riconosciuto":"❌ non riconosciuto"}`; };
    r.onerror=ev=>{ out.textContent="Errore: "+ev.error+(ev.error==="not-allowed"?" (consentite il microfono al sito)":""); }; r.start(); }catch(e){ out.textContent="Il riconoscimento non è disponibile."; } };
  const sE=$("#vsEN"); if(sE) sE.onchange=()=>{ P.vEN=sE.value; save(); voices(); say([["Hello! Look, a cat. Can you say cat?","en"]]); };
  const sI=$("#vsIT"); if(sI) sI.onchange=()=>{ P.vIT=sI.value; save(); voices(); say([["Ciao! Tocca la figura giusta.","it"]]); };
  $("#vtEN").onclick=()=>say([["Hello! Look, a cat. Can you say cat?","en"]]);
  $("#vtIT").onclick=()=>say([["Ciao! Tocca la figura giusta.","it"]]);
  a.querySelectorAll("[data-vr]").forEach(b=>b.onclick=()=>{ P.vRate=+b.dataset.vr; save(); render(); say([["Apple. Banana. Star.","en"]]); });
  a.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ P.goal=+b.dataset.g; save(); render(); });
  $("#exp").onclick=()=>{ const c=exportKids(), t=$("#kcode"); t.hidden=false; t.value=c;
    try{ navigator.clipboard.writeText(c).then(()=>toast("📋 Codice copiato"),()=>{ t.select(); toast("Selezionate e copiate il codice"); }); }catch(e){ t.select(); } };
  $("#imp").onclick=()=>{ const v=$("#kpaste").value; if(!v.trim()){ toast("Incollate prima il codice"); return; }
    if(parentArm!=="imp"){ parentArm="imp"; render(); $("#kpaste").value=v; return; }
    parentArm=""; if(importKids(v)){ toast("✅ Progressi ripristinati"); screen="home"; render(); } else { toast("❌ Codice non valido"); render(); } };
  $("#unlock").onclick=()=>{ if(parentArm==="unlock"){ P.pos=NODES.length; save(); parentArm=""; toast("Percorso sbloccato"); } else parentArm="unlock"; render(); };
  $("#reset").onclick=()=>{ if(parentArm==="reset"){ P=defP(); save(); parentArm=""; toast("Progressi azzerati"); } else parentArm="reset"; render(); };
}
render();
</script>

</body>
</html>
